<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出模看板">
<title>出模实时看板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0b0f14; color:#e8eef4; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         padding: 18px 16px 28px; max-width: 560px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  h1 { font-size:17px; font-weight:600; letter-spacing:.5px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .on { background:#2fbf71; box-shadow:0 0 8px #2fbf71; } .off { background:#e5534b; box-shadow:0 0 8px #e5534b; }
  .upd { font-size:12px; color:#8b98a5; }
  .card { background:#12181f; border:1px solid #1f2933; border-radius:14px; padding:16px; margin-bottom:12px; }
  .big { font-size:64px; font-weight:700; line-height:1; text-align:center; padding:8px 0 2px; }
  .big small { font-size:26px; color:#8b98a5; font-weight:500; }
  .bar { height:10px; background:#1f2933; border-radius:5px; overflow:hidden; margin:12px 0 6px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#2f81f7,#2fbf71); width:0%; transition:width .6s; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center; }
  .grid .v { font-size:21px; font-weight:600; }
  .grid .k { font-size:11px; color:#8b98a5; margin-top:2px; }
  .state { text-align:center; font-size:15px; color:#c9d4de; padding:2px 0 8px; }
  .idle { text-align:center; color:#8b98a5; font-size:15px; padding:14px 0; }
  h2 { font-size:13px; color:#8b98a5; font-weight:600; letter-spacing:1px; margin:2px 0 10px; }
  .note { display:flex; gap:10px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed #1f2933; }
  .note:last-child { border-bottom:none; }
  .note .t { color:#8b98a5; flex:0 0 64px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:6px 4px; border-bottom:1px solid #1f2933; text-align:left; }
  th { color:#8b98a5; font-weight:500; font-size:12px; }
  td.n, th.n { text-align:right; }
  .fail { color:#e5534b; } .okc { color:#2fbf71; } .wait { color:#d29922; }
  footer { text-align:center; color:#5b6874; font-size:11.5px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1><span id="dot" class="dot off"></span>出模实时看板</h1>
  <div class="upd num" id="upd">加载中…</div>
</header>

<div class="card" id="jobCard">
  <div class="idle">正在读取数据…</div>
</div>

<div class="card">
  <h2>播报</h2>
  <div id="notes"></div>
</div>

<div class="card">
  <h2>历史单</h2>
  <table>
    <thead><tr><th>时间</th><th>类型</th><th>参数</th><th class="n">耗时</th><th class="n">成品</th><th>结果</th></tr></thead>
    <tbody id="hist"></tbody>
  </table>
</div>

<footer>数据由 Muse 侧推送 · 页面每 30 秒自动刷新</footer>

<script>
function fmt(sec){ if(sec==null) return "—"; sec=Math.max(0,Math.round(sec));
  var m=Math.floor(sec/60), s=sec%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function render(d){
  document.getElementById("dot").className = "dot " + (d.bridge && d.bridge.online ? "on" : "off");
  document.getElementById("upd").textContent = "更新于 " + (d.updated_human || "—");
  var card = document.getElementById("jobCard"), j = d.job;
  if(!j){
    card.innerHTML = '<div class="idle">' + (d.bridge && d.bridge.online ? "桥在线 · 当前没有在跑的单" :
      "桥离线 · 电脑休息中<br><br>开工三步：<br>1. 开 Tailscale（桌面图标）<br>2. 开桥服务（桌面图标）<br>3. 在聊天里喊 Muse 一声") + "</div>";
  } else {
    var pct = (j.pct==null ? null : Math.round(j.pct));
    var stateTxt = {running:"生成中", done:"已完成", error:"出错", interrupted:"被中断"}[j.state] || j.state;
    var html = "";
    if(j.state==="running"){
      html += '<div class="big num">' + (pct==null?"··":pct) + '<small>%</small></div>';
      html += '<div class="state num">' + esc(stateTxt) + (j.step?(" · 第 " + j.step + " / " + j.steps_total + " 步"):"") + (j.phase?(" · " + esc(j.phase)):"") + '</div>';
      html += '<div class="bar"><i style="width:' + (pct||0) + '%"></i></div>';
      html += '<div class="grid num">' +
        '<div><div class="v">' + fmt(j.elapsed_s) + '</div><div class="k">已用</div></div>' +
        '<div><div class="v">' + fmt(j.eta_s) + '</div><div class="k">预计剩余</div></div>' +
        '<div><div class="v">' + (j.params? (j.params.steps + "/" + j.params.octree) : "—") + '</div><div class="k">步数/精度</div></div></div>';
    } else {
      html += '<div class="state" style="font-size:17px;padding-top:8px">' + esc(j.title || "最近一单") + " · " + esc(stateTxt) + '</div>';
      html += '<div class="grid num">' +
        '<div><div class="v">' + fmt(j.elapsed_s) + '</div><div class="k">耗时</div></div>' +
        '<div><div class="v">' + (j.result_mb? (j.result_mb.toFixed(2)+" MB") : "—") + '</div><div class="k">成品大小</div></div>' +
        '<div><div class="v">' + (j.params? (j.params.steps + "/" + j.params.octree) : "—") + '</div><div class="k">步数/精度</div></div></div>';
      if(j.verdict) html += '<div class="state" style="padding-top:10px">' + esc(j.verdict) + '</div>';
    }
    card.innerHTML = html;
  }
  var notes = (d.notes||[]).map(function(n){
    return '<div class="note"><span class="t num">' + esc(n.t) + '</span><span>' + esc(n.text) + '</span></div>';
  }).join("");
  document.getElementById("notes").innerHTML = notes || '<div class="note">暂无播报</div>';
  var hist = (d.history||[]).map(function(h){
    var cls = h.result==="过关" ? "okc" : (h.result==="判废" ? "fail" : "wait");
    return '<tr><td class="num">' + esc(h.time) + '</td><td>' + esc(h.kind) + '</td><td class="num">' + esc(h.params) +
      '</td><td class="n num">' + esc(h.dur) + '</td><td class="n num">' + esc(h.size) +
      '</td><td class="' + cls + '">' + esc(h.result) + '</td></tr>';
  }).join("");
  document.getElementById("hist").innerHTML = hist;
}
function load(){
  fetch("data.json?_=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.json(); })
    .then(render).catch(function(){ document.getElementById("upd").textContent = "数据读取失败，稍后重试"; });
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
